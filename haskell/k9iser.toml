# k9iser manifest for a2ml-haskell
# A2ML Haskell implementation — Cabal-based parser and validator for the A2ML format

[project]
name = "a2ml-haskell"
safety_tier = "hunt"

[[source]]
path = "a2ml-haskell.cabal"
type = "cabal"
output = "generated/k9iser/cabal-project.k9"

[[source]]
path = "Justfile"
type = "justfile"
output = "generated/k9iser/justfile-recipes.k9"

[[source]]
path = "Containerfile"
type = "containerfile"
output = "generated/k9iser/container-build.k9"

[[source]]
path = ".github/workflows/hypatia-scan.yml"
type = "workflow"
output = "generated/k9iser/ci-security.k9"

[[constraint]]
rule = "build.dependencies has no banned_packages"
severity = "error"

[[constraint]]
rule = "container.base_image uses chainguard or distroless"
severity = "warn"
